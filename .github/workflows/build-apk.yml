name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # The android/ folder is generated here instead of being stored in the repo.
      - name: Generate Android project
        run: |
          flutter create --project-name iraqi_business_ai --org com.iraqibusinessai --platforms android .
          rm -f test/widget_test.dart
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Release builds need explicit internet permission to reach Supabase.
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          sed -i 's/android:label="iraqi_business_ai"/android:label="مساعد التاجر"/' "$MANIFEST"
          grep -n 'INTERNET\|android:label' "$MANIFEST"

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: iraqi-business-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
